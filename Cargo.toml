[package]
name = "muxkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["南清 (NanQing)"]
description = "Lightweight terminal multiplexer — Rust rewrite for native Windows support (ConPTY), also on Unix"
license = "MIT"
readme = "README.md"
# After forking, point this at your own repository, e.g.
# repository = "https://github.com/<you>/MUXKIT"
# The upstream it forks is https://github.com/LatosProject/MUXKIT

[[bin]]
name = "mk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vte = "0.13"
portable-pty = "0.8"
unicode-width = "0.2"
interprocess = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_IO",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"